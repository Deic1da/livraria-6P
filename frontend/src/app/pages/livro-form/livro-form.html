<main class="pagina">
  <header class="topo">
    <a routerLink="/livros" class="link">Voltar pra lista</a>
  </header>

  <section class="painel">
    <h1>Cadastrar livro</h1>

    <form (ngSubmit)="salvar()">
      <label>Título <input name="titulo" [(ngModel)]="livro.titulo" required /></label>

      @for (tipo of tipos; track tipo.chave) {
        <div class="campo">
          <div class="rotulo">
            <span>{{ tipo.rotulo }}</span>
            <button type="button" class="link" (click)="abrirNovo(tipo.chave)" [attr.aria-expanded]="criando() === tipo.chave">
              {{ criando() === tipo.chave ? 'Cancelar' : '+ Novo' }}
            </button>
          </div>

          @if (criando() === tipo.chave) {
            <div class="novo">
              <input
                [name]="'novo-' + tipo.chave"
                [(ngModel)]="novoNome"
                [attr.aria-label]="'Nome do(a) novo(a) ' + tipo.rotulo.toLowerCase()"
                [placeholder]="'Nome do(a) novo(a) ' + tipo.rotulo.toLowerCase()"
              />
              <button type="button" class="discreto" (click)="adicionarNovo()">Adicionar</button>
            </div>
          } @else {
            <select [name]="tipo.chave" [(ngModel)]="livro[tipo.chave]" [attr.aria-label]="tipo.rotulo" required>
              <option value="" disabled>Escolha</option>
              @for (opcao of opcoes[tipo.chave](); track opcao.id) {
                <option [value]="opcao.id">{{ opcao.nome }}</option>
              }
            </select>
          }
        </div>
      }

      <div class="linha">
        <label>ISBN <input name="isbn" [(ngModel)]="livro.isbn" required /></label>
        <label>Ano <input name="ano" type="number" [(ngModel)]="livro.anoPublicacao" required /></label>
        <label>Preço (R$) <input name="preco" type="number" step="0.01" [(ngModel)]="livro.preco" required /></label>
      </div>

      @if (erro()) {
        <p class="erro" role="alert">{{ erro() }}</p>
      }

      <div class="acoes">
        <button type="submit" [disabled]="salvando()">{{ salvando() ? 'Salvando...' : 'Salvar livro' }}</button>
        <a routerLink="/livros" class="botao discreto">Cancelar</a>
      </div>
    </form>
  </section>
</main>
