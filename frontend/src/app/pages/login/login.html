<main class="login">
  <div class="bloco">
    <p class="marca">Livraria</p>
    <h1>{{ criando() ? 'Crie sua conta' : 'Entre na sua conta' }}</h1>

    <form (ngSubmit)="enviar()">
      <label>E-mail <input name="email" type="email" autocomplete="email" [(ngModel)]="email" required /></label>
      <label>
        Senha
        <input name="senha" type="password" [autocomplete]="criando() ? 'new-password' : 'current-password'" [(ngModel)]="senha" required />
      </label>
      @if (criando()) {
        <p class="ajuda">Pelo menos 6 caracteres.</p>
      }

      @if (erro()) {
        <p class="erro" role="alert">{{ erro() }}</p>
      }

      <button type="submit">{{ criando() ? 'Criar conta' : 'Entrar' }}</button>
    </form>

    <p class="troca">
      {{ criando() ? 'Já tem conta?' : 'Não tem conta?' }}
      <button type="button" class="link" (click)="alternar()">{{ criando() ? 'Entrar' : 'Criar conta' }}</button>
    </p>
  </div>
</main>
